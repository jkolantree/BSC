name: Verify release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"

jobs:
  q26-lean-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build the Q26 proof with the patched Lean toolchain
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: formal/q26_grid_annihilator
          auto-config: false
          build: true
          test: false
          lint: false
          leanchecker: false
          nanoda: false
          use-mathlib-cache: true
          use-github-cache: false

      - name: Replay the theorem through the patched Lean kernel
        working-directory: formal/q26_grid_annihilator
        run: lake env leanchecker Q26GridAnnihilator.Unconditional

      - name: Print the theorem axiom boundary
        working-directory: formal/q26_grid_annihilator
        run: lake env lean Q26GridAnnihilator/AxiomAudit.lean

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up CPython 3.12.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"

      - name: Run inventory, integrity, and regression gates
        run: make verify

      - name: Verify an active release candidate on the exact checkout
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import json; print(json.load(open("release/release-spec.json", encoding="utf-8"))["intended_version"] or "")')"
          if [[ -n "${version}" ]]; then
            python tools/build_archives.py \
              --candidate-version "${version}" \
              --output-directory "${RUNNER_TEMP}/bsc-release-candidate"
            make fixture-full
          fi

      - name: Verify final archive authority for a version tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test -n "${version}"
          python tools/build_archives.py \
            --release-version "${version}" \
            --output-directory "${RUNNER_TEMP}/bsc-release-authority"

      - name: Repeat the complete F11 enumeration for a release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: make fixture-full

  build-pdfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up CPython 3.12.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"

      - name: Install TeX Live build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            latexmk \
            texlive-fonts-recommended \
            texlive-latex-extra \
            texlive-science

      - name: Compile PDFs and verify pages and logs
        run: make build-check
