name: Verify release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"

jobs:
  bsc-core-lean-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Lean 4.33.0 and the matching mathlib cache
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: formal/bsc_core
          auto-config: false
          build: false
          test: false
          lint: false
          leanchecker: false
          nanoda: false
          use-mathlib-cache: true
          use-github-cache: false

      - name: Build the BSC core with a bounded heartbeat
        working-directory: formal/bsc_core
        timeout-minutes: 35
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess

          command = ("lake", "build")
          process = subprocess.Popen(command)
          while True:
              try:
                  return_code = process.wait(timeout=60)
                  break
              except subprocess.TimeoutExpired:
                  print("::notice::lake build is still running", flush=True)
          if return_code != 0:
              raise SystemExit(return_code)
          PY

      - name: Replay the BSC core through the Lean kernel
        working-directory: formal/bsc_core
        run: lake env leanchecker BscCore

      - name: Elaborate the BSC core public tests
        working-directory: formal/bsc_core
        run: lake env lean BscCore/Tests.lean

      - name: Reject prohibited proof shortcuts
        working-directory: formal/bsc_core
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E --include='*.lean' \
            '\bsorry\b|\badmit\b|^[[:space:]]*((private|protected|local)[[:space:]]+)*axiom\b|\bunsafe\b|\bnative_decide\b|\bbv_decide\b|maxHeartbeats[[:space:]]+0' \
            BscCore BscCore.lean; then
            echo 'Prohibited Lean construct found.' >&2
            exit 1
          fi

      - name: Print the BSC core axiom boundary
        working-directory: formal/bsc_core
        run: lake env lean BscCore/AxiomAudit.lean

  q26-lean-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up the patched Lean toolchain and mathlib cache
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: formal/q26_grid_annihilator
          auto-config: false
          build: false
          test: false
          lint: false
          leanchecker: false
          nanoda: false
          use-mathlib-cache: true
          use-github-cache: false

      - name: Build the Q26 proof with a bounded heartbeat
        working-directory: formal/q26_grid_annihilator
        timeout-minutes: 50
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess

          commands = (
              ("lake", "build", "+Q26GridAnnihilator.Shadow"),
              ("lake", "build", "+Q26GridAnnihilator.BichromaticRecipe"),
              ("lake", "build", "+Q26GridAnnihilator.MonochromaticRecipe"),
              ("lake", "build"),
          )
          for command in commands:
              label = " ".join(command)
              print(f"::group::{label}", flush=True)
              process = subprocess.Popen(command)
              while True:
                  try:
                      return_code = process.wait(timeout=60)
                      break
                  except subprocess.TimeoutExpired:
                      print(f"::notice::{label} is still running", flush=True)
              print("::endgroup::", flush=True)
              if return_code != 0:
                  raise SystemExit(return_code)
          PY

      - name: Replay the definitive theorem through the patched Lean kernel
        working-directory: formal/q26_grid_annihilator
        run: lake env leanchecker Q26GridAnnihilator.Definitive

      - name: Print the theorem axiom boundary
        working-directory: formal/q26_grid_annihilator
        run: lake env lean Q26GridAnnihilator/AxiomAudit.lean

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up CPython 3.12.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"

      - name: Run inventory, integrity, and regression gates
        run: make verify

      - name: Verify an active release candidate on the exact checkout
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import json; print(json.load(open("release/release-spec.json", encoding="utf-8"))["intended_version"] or "")')"
          if [[ -n "${version}" ]]; then
            python tools/build_archives.py \
              --candidate-version "${version}" \
              --output-directory "${RUNNER_TEMP}/bsc-release-candidate"
            make fixture-full
          fi

      - name: Verify final archive authority for a version tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test -n "${version}"
          python tools/build_archives.py \
            --release-version "${version}" \
            --output-directory "${RUNNER_TEMP}/bsc-release-authority"

      - name: Repeat the complete F11 enumeration for a release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: make fixture-full

  build-pdfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up CPython 3.12.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"

      - name: Install TeX Live build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            latexmk \
            texlive-fonts-recommended \
            texlive-latex-extra \
            texlive-science

      - name: Compile PDFs and verify pages and logs
        run: make build-check
